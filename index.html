<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f4ea"><title>컵랜드 | 우리 동네 다회용 생활</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>
:root{--ivory:#f8f4ea;--brown:#493429;--green:#17643c;--soft:#e8f2e6;--line:#e8dfd1;--muted:#796b5c}*{box-sizing:border-box}body{margin:0;background:#ede6d9;color:var(--brown);font:15px/1.55 system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif}button,input,select{font:inherit}button{cursor:pointer;min-height:44px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d7a943;outline-offset:2px}.shell{max-width:520px;margin:auto;min-height:100dvh;background:var(--ivory);box-shadow:0 0 30px #57422e12;padding-bottom:calc(84px + env(safe-area-inset-bottom))}.header{padding:calc(16px + env(safe-area-inset-top)) 20px 14px;display:flex;align-items:center;justify-content:space-between;background:var(--ivory)}.brand{font-weight:900;font-size:23px;letter-spacing:-1.2px;color:var(--brown)}.brand span{color:var(--green)}.badge{background:#eee5d6;color:#655444;border-radius:20px;font-size:11px;font-weight:700;padding:5px 10px}.content{padding:0 20px 24px}.welcome{text-align:center;padding-top:25px}.illustration{height:116px;width:116px;border-radius:40px;background:#e3eddb;display:grid;place-items:center;margin:0 auto 20px;font-size:54px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.09em}h1{font-size:31px;letter-spacing:-1.4px;line-height:1.23;margin:8px 0 12px}h2{font-size:23px;letter-spacing:-.8px;margin:0 0 6px}h3{font-size:17px;margin:0 0 6px}.intro{color:#6e5b4d;margin:0 auto 20px;line-height:1.75;font-size:14px;max-width:390px}.goal{background:#efe8d9;border:1px solid #e6ddcb;border-radius:16px;padding:15px;text-align:left;font-size:13px;margin:18px 0}.goal b{display:block;color:var(--green);font-size:11px;letter-spacing:.08em;margin-bottom:5px}.button{background:var(--green);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:750;min-height:48px}.button.alt{background:#e6f0e6;color:#185838}.button.line{background:transparent;color:var(--green);border:1px solid #a1b9a0}.button:disabled{opacity:.45;cursor:not-allowed}.full{width:100%}.stack{display:grid;gap:10px}.muted{color:var(--muted);font-size:13px}.tiny{font-size:12px;color:#75695d}.card{background:#fffdf8;border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0;box-shadow:0 4px 15px #59422d08}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.grow{flex:1}.wrap{flex-wrap:wrap}.chip{display:inline-block;background:#e9f2e7;color:#276340;border-radius:100px;padding:4px 9px;font-weight:700;font-size:12px}.field{width:100%;background:white;border:1px solid #ded3c3;color:var(--brown);border-radius:11px;min-height:46px;padding:10px 12px;margin:6px 0 12px}.label{font-size:13px;font-weight:700}.map{height:245px;position:relative;border-radius:18px;overflow:hidden;background-color:#e6e9d7;background-image:linear-gradient(30deg,transparent 43%,#faf6ec 44%,#faf6ec 49%,transparent 50%),linear-gradient(132deg,transparent 42%,#fffaf0 43%,#fffaf0 47%,transparent 48%);background-size:155px 110px,210px 160px}.map::after{content:'예시 위치도 · 실제 지도 아님';position:absolute;bottom:10px;left:10px;background:#fffdf1e8;padding:4px 8px;border-radius:8px;font-size:11px}.pin{position:absolute;background:var(--green);color:white;border:2px solid white;border-radius:20px;padding:6px 9px;font-size:12px;box-shadow:0 3px 7px #0003;min-height:40px}.listrow{padding:14px 0;border-top:1px solid var(--line)}.notice{font-size:12px;background:#f4ecdc;border-radius:12px;padding:12px;color:#6c5844;margin:14px 0}.nav{position:fixed;bottom:0;width:min(520px,100%);display:flex;justify-content:space-around;background:#fffdf8;border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom));z-index:4}.nav button{background:none;border:0;color:#75695d;font-size:11px;padding:5px;min-width:52px}.nav button.active{color:var(--green);font-weight:800}.nav span{display:block;font-size:19px}.hidden{display:none!important}.dialog{border:0;border-radius:20px;padding:0;width:min(480px,calc(100% - 24px));max-height:85dvh;overflow:auto;background:#fffdf8;color:var(--brown)}.dialog::backdrop{background:#30261cb0}.dialogbody{padding:20px}.close{border:0;border-radius:50%;width:44px;background:#f1ebdf;color:var(--brown);font-size:20px}.buttonrow{display:flex;gap:8px}.buttonrow>*{flex:1}.amount{font-size:30px;font-weight:900;color:var(--green)}.ranking{display:grid;grid-template-columns:36px 1fr auto;gap:10px;padding:13px 3px;border-top:1px solid var(--line)}.empty{text-align:center;padding:28px 10px;color:var(--muted)}.status{color:var(--green);font-weight:700}.foot{font-size:11px;line-height:1.6;color:#827364;margin:20px 2px}.sep{height:1px;background:var(--line);margin:15px 0}
.map{height:320px;background:#e8e4d9;background-image:none}.map::after{content:none}.leaflet-container{font:inherit}.leaflet-control button{min-height:0}.search-results button{width:100%;text-align:left;margin-top:5px}.map-status{min-height:20px}</style></head><body><div class="shell"><header class="header"><div class="brand">♻ <span>컵</span>랜드</div><span class="badge">모바일 체험판</span></header><main id="app" class="content"></main><nav class="nav hidden" id="nav" aria-label="주요 메뉴"><button data-screen="map" onclick="go('map')"><span>⌖</span>지도</button><button data-screen="rentals" onclick="need('rentals')"><span>☕</span>내 대여</button><button data-screen="points" onclick="need('points')"><span>✿</span>포인트</button><button data-screen="coupons" onclick="need('coupons')"><span>🎟</span>쿠폰</button><button data-screen="rank" onclick="need('rank')"><span>♧</span>동네 순위</button><button data-screen="operator" onclick="go('operator')"><span>☰</span>운영</button></nav></div><dialog class="dialog" id="dialog"><div id="dialogbody" class="dialogbody"></div></dialog><script>
'use strict';
const KEY='cupland_demo_2026_v1';const defaults=[{id:'a',name:'숲길 카페 (예시)',address:'서울 마포구 연남로 12 (예시)',hours:'09:00–19:00',phone:'02-000-0000',cup:7,box:3,washCup:0,washBox:0,status:'approved',open:true,returns:true},{id:'b',name:'따뜻한 오후 (예시)',address:'서울 마포구 망원로 36 (예시)',hours:'10:00–20:00',phone:'02-000-0000',cup:5,box:2,washCup:0,washBox:0,status:'approved',open:true,returns:true},{id:'c',name:'순환 커피 (예시)',address:'서울 마포구 월드컵북로 20 (예시)',hours:'09:30–18:30',phone:'02-000-0000',cup:3,box:1,washCup:0,washBox:0,status:'approved',open:true,returns:true}];
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.cafes)S={cafes:defaults,logged:false,points:500,rentals:[],ledger:[{text:'체험 시작 포인트 (예시)',n:500,at:new Date().toISOString()}],coupons:[],region:'서울 마포구',public:true};let screen='welcome',query='',filter='all',next=null,selected=null;let liveMap=null,locMarker=null,currentPos=null,geoRequested=false,searchPlaces=[],placeMarker=null,lastSearch=0;const app=document.getElementById('app'),nav=document.getElementById('nav'),dlg=document.getElementById('dialog');
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('브라우저 저장 공간을 사용할 수 없습니다.')}}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return Number(n).toLocaleString('ko-KR')}function day(v){return new Date(v).toLocaleDateString('ko-KR')}function approved(){return S.cafes.filter(c=>c.status==='approved')}function cafe(id){return S.cafes.find(c=>c.id===id)}function modal(body){document.getElementById('dialogbody').innerHTML=`<div class="row between"><b>컵랜드 · 체험판</b><button class="close" onclick="dlg.close()" aria-label="닫기">×</button></div>${body}`;if(!dlg.open)dlg.showModal()}function go(s){if(liveMap){liveMap.remove();liveMap=null;locMarker=null;placeMarker=null;}screen=s;nav.classList.toggle('hidden',s==='welcome'||s==='login');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.screen===s));render();window.scrollTo(0,0)}function need(s,id){if(!S.logged){next={screen:s,id};go('login')}else{if(id)selected=id;go(s)}}function render(){({welcome,login,map,rentals,points,coupons,rank,operator,admin,rent,returns})[screen]();if(!['welcome','login'].includes(screen))app.insertAdjacentHTML('beforeend','<p class="foot">체험용 가상 데이터입니다. 실제 지도는 인터넷 연결이 필요합니다. 제휴 카페, 계정, QR 및 결제는 체험용입니다. 데이터는 이 기기의 브라우저에만 저장됩니다.</p>')}
function welcome(){app.innerHTML=`<section class="welcome"><div class="illustration" aria-hidden="true">☕</div><div class="eyebrow">작은 반납, 커다란 변화</div><h1>우리 동네 다회용 생활,<br>컵랜드에서 시작해요</h1><p class="intro">컵랜드는 우리 동네 제휴 카페의 다회용 컵,용기 대여소와 반납 가능 위치를 지도에서 찾아 주는 앱입니다. 어느 제휴 카페에서든 빌리고 반납할 수 있고, 반납하면 친환경 포인트가 쌓입니다. 포인트는 제휴 카페의 할인이나 음료 쿠폰으로 교환할 수 있습니다.</p><div class="stack"><button class="button full" onclick="next=null;go('login')">회원가입/로그인</button><button class="button full" onclick="go('map')">지도 보기</button></div><div class="goal"><b>함께 만드는 변화 · 12-5</b>12-5 폐기물의 원천예방과 감량, 재사용을 통해 폐기물 발생을 감소한다.</div><p class="foot">실제 서비스가 아닌 브라우저 체험판입니다.</p></section>`}
function login(){app.innerHTML=`<button class="button line" onclick="go('welcome')">← 처음으로</button><section class="card"><h2>반가워요!</h2><p class="muted">회원가입/로그인 체험</p><div class="notice">실제 계정이나 인증이 아닙니다. 이름·이메일·비밀번호 등 개인정보를 입력하지 마세요.</div><button class="button full" onclick="loginDemo()">체험용 로그인으로 시작</button><button class="button alt full" style="margin-top:10px" onclick="go('map')">로그인 없이 지도 보기</button></section>`}
function loginDemo(){S.logged=true;save();let n=next;next=null;if(n){if(n.id)selected=n.id;go(n.screen)}else go('map')}
function map(){app.innerHTML=`<h2>우리 동네 카페 찾기</h2><p class="muted">HTTPS 웹 주소에서 실제 지도와 현재 위치를 확인하세요.</p><form id="mapSearch"><label class="label" for="search">카페 또는 주소 검색</label><input id="search" class="field" autocomplete="off" placeholder="카페 이름이나 주소를 입력하세요" value="${esc(query)}"><button class="button full" type="submit">검색</button></form><div id="placeResults" class="search-results" aria-live="polite"></div><label class="label" for="filter">체험용 제휴 카페 필터</label><select id="filter" class="field"><option value="all">전체</option><option value="open">영업 가능 (예시)</option><option value="rent">대여 가능</option><option value="return">반납 가능</option><option value="cup">컵 재고 있음</option><option value="box">용기 재고 있음</option></select><div id="realMap" class="map" aria-label="실제 지도"></div><p id="mapStatus" class="tiny map-status" aria-live="polite">지도 불러오는 중…</p><button class="button alt full" type="button" onclick="locateNow()">⌖ 현재 위치 찾기</button><p class="tiny">지도 © OpenStreetMap 기여자. 위치는 기기에서만 확인하며, 장소 검색은 OpenStreetMap 사이트에서 별도로 진행됩니다.</p><div class="row between"><h3>체험용 제휴 카페 <span class="status" id="cafeCount"></span></h3></div><p class="tiny">아래 카페는 가상 예시이며 실제 제휴 매장이 아닙니다. 지도에 표시하지 않습니다.</p><section class="card" id="cafeList"></section>`;
 document.getElementById('filter').value=filter;document.getElementById('filter').onchange=e=>{filter=e.target.value;updateCafeList()};
 const input=document.getElementById('search');input.addEventListener('input',e=>{query=e.target.value;if(!e.isComposing)updateCafeList()});input.addEventListener('compositionend',e=>{query=e.target.value;updateCafeList()});document.getElementById('mapSearch').onsubmit=e=>{e.preventDefault();if(e.isComposing)return;query=input.value.trim();updateCafeList();searchLocation(query)};updateCafeList();initMap();}
function updateCafeList(){let el=document.getElementById('cafeList');if(!el)return;let arr=approved().filter(c=>(c.name+' '+c.address).toLowerCase().includes(query.toLowerCase())).filter(c=>filter==='all'||filter==='rent'&&(c.cup+c.box>0)&&c.open||filter==='return'&&c.returns||filter==='cup'&&c.cup>0||filter==='box'&&c.box>0||filter==='open'&&c.open);document.getElementById('cafeCount').textContent=arr.length;el.innerHTML=arr.length?arr.map(c=>`<div class="listrow row between"><div class="grow"><b>${esc(c.name)}</b><div class="tiny">${esc(c.address)}</div><span class="chip">반납 +100P (예시)</span></div><button class="button alt" onclick="summary('${c.id}')">보기</button></div>`).join(''):'<div class="empty">일치하는 체험용 카페가 없습니다.</div>'}
function mapStatus(text){let e=document.getElementById('mapStatus');if(e)e.textContent=text}
function initMap(){if(location.protocol==='file:'){mapStatus('파일을 직접 열면 지도가 차단될 수 있습니다. HTTPS 웹 주소에서 열어주세요.');return}if(typeof L==='undefined'){mapStatus('지도를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 열어주세요.');return}liveMap=L.map('realMap').setView([37.5665,126.9780],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,referrerPolicy:'strict-origin-when-cross-origin',attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap 기여자</a>'}).addTo(liveMap);mapStatus('서울 중심을 표시합니다. 현재 위치 버튼으로 위치를 확인할 수 있습니다.');if(currentPos)markLocation(currentPos,true);else if(!geoRequested){geoRequested=true;locateNow()}}
function markLocation(pos,center=true){currentPos=pos;if(!liveMap)return;if(locMarker)liveMap.removeLayer(locMarker);locMarker=L.circleMarker([pos.latitude,pos.longitude],{radius:9,color:'#fff',weight:3,fillColor:'#1764cf',fillOpacity:1}).addTo(liveMap).bindPopup('현재 위치 (기기 위치 추정)');if(center)liveMap.setView([pos.latitude,pos.longitude],16);mapStatus('현재 위치 표시 중 · 정확도 약 '+Math.round(pos.accuracy)+'m')}
function locateNow(){if(!navigator.geolocation){mapStatus('이 브라우저에서 위치 기능을 지원하지 않습니다.');return}if(!window.isSecureContext){mapStatus('현재 위치에는 HTTPS 웹사이트 또는 localhost가 필요합니다. 안전한 주소로 앱을 열어주세요.');return}mapStatus('현재 위치를 확인 중입니다. 권한 요청을 허용해 주세요.');navigator.geolocation.getCurrentPosition(p=>{if(screen==='map')markLocation(p.coords);else currentPos=p.coords},err=>{mapStatus(err.code===1?'위치 권한이 거부되었습니다. 기기 설정에서 허용하거나 검색을 이용하세요.':err.code===3?'위치 확인 시간이 초과되었습니다. 다시 시도해 주세요.':'현재 위치를 확인할 수 없습니다. GPS와 인터넷을 확인하세요.')},{enableHighAccuracy:true,timeout:15000,maximumAge:30000})}
function searchLocation(q){let box=document.getElementById('placeResults');if(!q){box.innerHTML='<p class="tiny">검색어를 입력해 주세요.</p>';return}const url='https://www.openstreetmap.org/search?query='+encodeURIComponent(q);box.innerHTML='<p class="tiny">실제 장소는 OpenStreetMap에서 검색합니다. 검색 결과는 컵랜드 제휴 여부가 확인되지 않았습니다.</p><a class="button alt" target="_blank" rel="noopener noreferrer" href="'+esc(url)+'">OpenStreetMap에서 장소 검색 ↗</a>'}

function showPlace(i){let x=searchPlaces[i];if(!x||!liveMap)return;let lat=Number(x.lat),lon=Number(x.lon);if(!Number.isFinite(lat)||!Number.isFinite(lon))return;if(placeMarker)liveMap.removeLayer(placeMarker);placeMarker=L.circleMarker([lat,lon],{radius:8,color:'#17643c',fillColor:'#17643c',fillOpacity:1}).addTo(liveMap);let label=document.createElement('div');label.textContent=x.display_name+' · 제휴 여부 미확인';placeMarker.bindPopup(label).openPopup();liveMap.setView([lat,lon],16)}

function summary(id){let c=cafe(id);if(!c||c.status!=='approved')return;let canRent=c.open&&(c.cup+c.box>0);modal(`<h2>${esc(c.name)}</h2><span class="chip">승인된 예시 카페</span><p class="muted">${esc(c.address)}<br>거리: 위치 확인 불가 · 실제 거리 제공 안 됨<br>운영 시간 ${esc(c.hours)}</p><div class="card"><div>대여: <b>${canRent?'가능':'불가 · 재고 또는 운영 상태 확인'}</b></div><div>반납: <b>${c.returns?'가능':'불가'}</b></div><div>반납 포인트: <b>+100P / 개 (예시)</b></div></div><div class="stack"><div class="buttonrow"><button class="button" ${canRent?'':'disabled'} onclick="dlg.close();need('rent','${c.id}')">대여하기</button><button class="button" ${c.returns?'':'disabled'} onclick="dlg.close();need('returns','${c.id}')">반납하기</button></div><button class="button alt full" onclick="details('${c.id}')">상세보기</button></div>`)}
function details(id){let c=cafe(id);modal(`<h2>${esc(c.name)}</h2><p class="muted">카페 · 다회용 컵 · 다회용 용기</p><div class="listrow">📍 ${esc(c.address)}<br>☎ ${esc(c.phone)}<br>🕒 ${esc(c.hours)}<br>거리: 위치 확인 불가</div><div class="listrow"><b>용기별 대여 가능 재고</b><br>컵 ${c.cup}개 · 용기 ${c.box}개<br><span class="tiny">세척 대기: 컵 ${c.washCup||0}개 · 용기 ${c.washBox||0}개</span></div><div class="listrow"><b>반납 포인트 목록</b><br>컵 +100P · 용기 +100P / 개 (예시)</div><p class="notice">사진과 재고 갱신 시각은 제공되지 않습니다. 모든 정보는 예시이며 실제 카페가 아닙니다.</p><div class="buttonrow"><button class="button" ${c.open&&(c.cup+c.box)>0?'':'disabled'} onclick="dlg.close();need('rent','${c.id}')">대여하기</button><button class="button" ${c.returns?'':'disabled'} onclick="dlg.close();need('returns','${c.id}')">반납하기</button></div>`)}
function rent(){let c=cafe(selected);if(!c||c.status!=='approved'){go('map');return}app.innerHTML=`<button class="button line" onclick="go('map')">← 지도</button><section class="card"><h2>대여하기</h2><p class="muted">${esc(c.name)} · 대여 기한 7일 (예시)</p><label class="label">용기 종류</label><select class="field" id="type"><option value="cup" ${c.cup?'':'disabled'}>다회용 컵 · ${c.cup}개</option><option value="box" ${c.box?'':'disabled'}>다회용 용기 · ${c.box}개</option></select><label class="label">포인트 혜택 · 중복 적용 불가</label><select class="field" id="benefit" onchange="preview()"><option value="none">사용 안 함</option><option value="fee">대여료 결제 200P</option><option value="deposit">보증금 면제 300P</option></select><div id="preview"></div><p class="notice">QR 스캔과 결제 없이 진행하는 모의 대여입니다. 보증금 면제에 사용한 포인트는 소모됩니다.</p><button class="button full" onclick="doRent()">모의 대여 확정</button></section>`;preview()}
function preview(){let b=document.getElementById('benefit').value,n=b==='fee'?200:b==='deposit'?300:0;document.getElementById('preview').innerHTML=`<div class="listrow">사용 ${n}P · 보유 ${money(S.points)}P<br>대여료 ${b==='fee'?'0':'200'}원 · 보증금 ${b==='deposit'?'면제':'1,000원'} <span class="tiny">(모의)</span></div>`}
function doRent(){let c=cafe(selected),type=document.getElementById('type').value,b=document.getElementById('benefit').value,n=b==='fee'?200:b==='deposit'?300:0;if(!c||!c.open||!c[type])return alert('대여 가능한 재고가 없습니다.');if(S.points<n)return alert('포인트가 부족합니다.');c[type]--;S.points-=n;if(n)S.ledger.unshift({text:b==='fee'?'대여료 포인트 사용':'보증금 면제 포인트 사용',n:-n,at:new Date().toISOString()});S.rentals.unshift({id:'r'+Date.now(),type,cafe:c.name,at:new Date().toISOString(),due:new Date(Date.now()+604800000).toISOString(),returned:false});save();go('rentals')}
function rentals(){app.innerHTML=`<h2>내 대여</h2><p class="muted">현재 대여와 반납 내역을 확인하세요.</p><section class="card">${S.rentals.length?S.rentals.map(r=>`<div class="listrow"><div class="row between"><b>다회용 ${r.type==='cup'?'컵':'용기'} 1개</b><span class="chip">${r.returned?'반납 완료':'대여 중'}</span></div><div class="tiny">${esc(r.cafe)} · ${day(r.at)} 대여<br>반납 기한 ${day(r.due)}${r.returned?' · '+esc(r.returnCafe)+' 반납':''}</div>${r.returned?'':`<button class="button alt" style="margin-top:10px" onclick="selected=null;go('returns')">반납할 카페 찾기</button>`}</div>`).join(''):'<div class="empty">아직 대여한 용기가 없어요.</div>'}</section><button class="button full" onclick="go('map')">카페 찾기</button>`}
function returns(){let active=S.rentals.filter(r=>!r.returned),cs=approved().filter(c=>c.returns);app.innerHTML=`<button class="button line" onclick="go('map')">← 지도</button><section class="card"><h2>반납할 카페 확인</h2><p class="muted">위치 확인 불가 · 예시 카페 목록입니다. 실제 가까운 순서가 아닙니다.</p>${active.length&&cs.length?`<label class="label">대여 중인 용기</label><select class="field" id="rental">${active.map(r=>`<option value="${r.id}">${r.type==='cup'?'컵':'용기'} · ${esc(r.cafe)} · ${day(r.at)}</option>`).join('')}</select><label class="label">반납 가능 카페</label><select class="field" id="returnCafe">${cs.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)} · ${esc(c.address)}</option>`).join('')}</select><p class="notice">실제 QR이나 직원 검수는 제공되지 않습니다. 모의 반납 시 100P를 받고 세척 대기 재고가 늘어납니다.</p><button class="button full" onclick="doReturn()">운영자 확인 후 모의 반납</button>`:'<div class="empty">대여 중인 용기 또는 반납 가능 카페가 없습니다.</div>'}</section>`}
function doReturn(){let r=S.rentals.find(x=>x.id===document.getElementById('rental').value),c=cafe(document.getElementById('returnCafe').value);if(!r||r.returned||!c||!c.returns)return alert('반납할 수 없습니다.');r.returned=true;r.returnedAt=new Date().toISOString();r.returnCafe=c.name;r.region=S.region;c[r.type==='cup'?'washCup':'washBox']=(c[r.type==='cup'?'washCup':'washBox']||0)+1;S.points+=100;S.ledger.unshift({text:'정상 반납 적립 · '+c.name,n:100,at:r.returnedAt});save();alert('모의 반납 완료! 100P가 적립됐어요.');go('rentals')}
function points(){app.innerHTML=`<section class="card"><p class="muted">나의 친환경 포인트</p><div class="amount">${money(S.points)} P</div><p class="tiny">반납 1개당 100P 적립 · 체험 예시</p><button class="button full" onclick="go('coupons')">포인트로 쿠폰 교환하기</button></section><section class="card"><h3>포인트 내역</h3>${S.ledger.map(x=>`<div class="listrow row between"><div>${esc(x.text)}<div class="tiny">${day(x.at)}</div></div><b>${x.n>0?'+':''}${money(x.n)}P</b></div>`).join('')}</section>`}
const products=[{id:'discount',name:'카페 500원 할인 쿠폰',cost:300,desc:'예시 제휴 카페에서 500원 할인'}, {id:'drink',name:'음료 쿠폰',cost:500,desc:'예시 제휴 카페 음료 1잔'}];function coupons(){app.innerHTML=`<h2>포인트 혜택</h2><p class="muted">반납으로 모은 포인트를 쿠폰으로 바꿔요.</p><div class="notice">쿠폰·금액·유효기간은 모두 가상 예시이며 실제 매장에서 사용할 수 없습니다.</div>${products.map(p=>`<div class="card"><span class="chip">제휴 카페 혜택 · 예시</span><h3 style="margin-top:10px">${p.name}</h3><p class="tiny">${p.desc} · 교환 후 30일 · 예시 카페 전체</p><div class="row between"><b>${money(p.cost)}P</b><button class="button" onclick="exchange('${p.id}')">교환하기</button></div></div>`).join('')}<h3>내 쿠폰</h3><section class="card">${S.coupons.length?S.coupons.map(c=>`<div class="listrow"><div class="row between"><b>${esc(c.name)}</b><span class="chip">${c.used?'사용 완료':Date.now()>new Date(c.expire).getTime()?'기간 만료':'사용 가능'}</span></div><div class="tiny">만료 ${day(c.expire)} · 실제 사용 불가</div>${!c.used&&Date.now()<=new Date(c.expire).getTime()?`<button class="button alt" style="margin-top:8px" onclick="useCoupon('${c.id}')">매장 확인 후 모의 사용</button>`:''}</div>`).join(''):'<div class="empty">아직 교환한 쿠폰이 없어요.</div>'}</section>`}
function exchange(id){let p=products.find(x=>x.id===id);if(!p||S.points<p.cost)return alert('포인트가 부족합니다.');if(!confirm(`${p.name}을(를) ${p.cost}P로 교환할까요? (모의 쿠폰)`))return;S.points-=p.cost;S.coupons.unshift({id:'q'+Date.now(),name:p.name,expire:new Date(Date.now()+30*86400000).toISOString(),used:false});S.ledger.unshift({text:p.name+' 교환',n:-p.cost,at:new Date().toISOString()});save();render()}
function useCoupon(id){let c=S.coupons.find(x=>x.id===id);if(!c||c.used||Date.now()>new Date(c.expire).getTime())return alert('사용할 수 없는 쿠폰입니다.');if(!confirm('운영자 확인을 가정하고 쿠폰을 모의 사용 처리할까요?'))return;c.used=true;save();render()}
function rank(){let now=new Date(),month=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),score=S.rentals.filter(r=>r.returned&&r.region===S.region&&r.returnedAt.slice(0,7)===month).length*100,data=[{name:'초록친구 (예시)',score:900},{name:'동네순환 (예시)',score:400},{name:'컵사랑 (예시)',score:200}];if(S.public)data.push({name:'나',score});data.sort((a,b)=>b.score-a.score);app.innerHTML=`<h2>우리 동네 순위</h2><p class="muted">월간 정상 반납 적립 포인트 기준</p><section class="card"><label class="label">활동 지역</label><input id="region" class="field" value="${esc(S.region)}" maxlength="40"><label class="label">순위 공개</label><select id="public" class="field"><option value="yes" ${S.public?'selected':''}>참여</option><option value="no" ${!S.public?'selected':''}>비공개</option></select><button class="button alt" onclick="saveRank()">설정 저장</button><p class="notice">${esc(S.region)} · ${month} · 다른 참가자는 예시입니다. 지역 변경 전 점수는 기존 지역에 남습니다.</p>${data.map(x=>`<div class="ranking"><b>${data.findIndex(y=>y.score===x.score)+1}</b><b>${esc(x.name)}</b><span>${money(x.score)}P</span></div>`).join('')}<p class="tiny">내 점수 ${score}P · 포인트 사용과 순위 점수는 별개입니다.</p></section>`}
function saveRank(){let v=document.getElementById('region').value.trim();if(!v)return alert('지역을 입력해 주세요.');S.region=v;S.public=document.getElementById('public').value==='yes';save();render()}
function operator(){app.innerHTML=`<h2>카페 운영 · 체험</h2><p class="muted">카페 등록과 재고 관리를 미리 살펴보세요.</p><section class="card"><h3>카페 등록 신청</h3><form id="form"><label class="label">카페명<input class="field" name="name" required maxlength="50"></label><label class="label">주소<input class="field" name="address" required maxlength="100"></label><label class="label">연락처 (예시만 입력)<input class="field" name="phone" required maxlength="30"></label><label class="label">운영 시간<input class="field" name="hours" required placeholder="예: 09:00–18:00"></label><label class="label">컵 재고<input class="field" name="cup" type="number" min="0" max="1000" value="5" required></label><label class="label">용기 재고<input class="field" name="box" type="number" min="0" max="1000" value="2" required></label><button class="button full">모의 등록 신청</button></form><p class="notice">사업자 확인 및 실제 등록이 아닙니다. 개인정보·증빙자료를 입력하지 마세요.</p></section><section class="card"><h3>매장 재고</h3>${S.cafes.map(c=>`<div class="listrow"><b>${esc(c.name)}</b> <span class="chip">${c.status==='approved'?'승인':c.status==='pending'?'심사 대기':'반려'}</span><div class="tiny">대여 가능: 컵 ${c.cup} · 용기 ${c.box}<br>세척 대기: 컵 ${c.washCup||0} · 용기 ${c.washBox||0}</div><div class="row wrap">${c.washCup?`<button class="button alt" onclick="wash('${c.id}','cup')">컵 세척 완료 1개</button>`:''}${c.washBox?`<button class="button alt" onclick="wash('${c.id}','box')">용기 세척 완료 1개</button>`:''}</div></div>`).join('')}</section><button class="button full" onclick="go('admin')">모의 관리자 화면</button>`;document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let name=String(f.get('name')).trim(),address=String(f.get('address')).trim();if(!name||!address)return alert('카페명과 주소를 입력해 주세요.');S.cafes.push({id:'c'+Date.now(),name,address,phone:String(f.get('phone')).trim(),hours:String(f.get('hours')).trim(),cup:Number(f.get('cup')),box:Number(f.get('box')),washCup:0,washBox:0,status:'pending',open:true,returns:true});save();alert('모의 등록 신청 완료. 관리자 화면에서 승인할 수 있습니다.');render()}}
function wash(id,type){let c=cafe(id),k=type==='cup'?'washCup':'washBox';if(c&&c[k]>0){c[k]--;c[type]++;save();render()}}
function admin(){let pending=S.cafes.filter(c=>c.status==='pending');app.innerHTML=`<button class="button line" onclick="go('operator')">← 운영</button><section class="card"><h2>모의 매장 심사</h2><p class="notice">실제 인증과 접근 권한이 없는 체험 화면입니다.</p>${pending.length?pending.map(c=>`<div class="listrow"><b>${esc(c.name)}</b><div class="tiny">${esc(c.address)} · ${esc(c.phone)} · ${esc(c.hours)}</div><div class="row wrap"><button class="button" onclick="review('${c.id}','approved')">모의 승인</button><button class="button alt" onclick="review('${c.id}','rejected')">모의 반려</button></div></div>`).join(''):'<div class="empty">대기 중인 신청이 없어요.</div>'}</section><button class="button alt full" onclick="reset()">체험 데이터 초기화</button>`}
function review(id,status){let c=cafe(id);if(c&&c.status==='pending'){c.status=status;save();render()}}function reset(){if(confirm('이 브라우저의 컵랜드 체험 데이터를 모두 지울까요?')){localStorage.removeItem(KEY);location.reload()}}render();
</script></body></html>
